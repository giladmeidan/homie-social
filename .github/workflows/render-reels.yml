name: Render reels

# Runs when the nightly reel task pushes a new batch (content/batches/*.json) or
# new episodes. Renders every reel that has not been sent yet, checks it, and
# sends it to the Telegram approval bot. Nothing is posted without Approve.
on:
  push:
    branches: [main]
    paths:
      - 'content/batches/**'
      - 'content/episodes/**'
      - 'content/engine2/reels/**'
  workflow_dispatch:
    inputs:
      retry_failed:
        description: 'Retry reels that failed before'
        type: boolean
        default: false
      dry_run:
        description: 'Render and check only, do not send to Telegram'
        type: boolean
        default: false
      voice_check:
        description: 'Only check the ElevenLabs key: credits left and which models speak Hebrew'
        type: boolean
        default: false
      voice_audition:
        description: 'Only send voice samples to Telegram: "mine" (your My Voices) or voice ids, comma separated'
        type: string
        default: ''
      backfill_beats:
        description: 'Only save the hook/buildup/payoff timing of already-sent reels to the dashboard (retention insight)'
        type: boolean
        default: false

permissions:
  contents: write # commits the content/sent and content/failed markers

concurrency:
  group: render-reels
  cancel-in-progress: false

jobs:
  voice-check:
    if: inputs.voice_check || inputs.voice_audition != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the ElevenLabs key
        if: inputs.voice_check
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_LICENSED: ${{ vars.ELEVENLABS_LICENSED || secrets.ELEVENLABS_LICENSED }}
        run: python3 scripts/elevenlabs-check.py
      - name: Send voice samples to Telegram
        if: inputs.voice_audition != ''
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUDITION: ${{ inputs.voice_audition }}
        run: python3 scripts/voice-audition.py

  backfill-beats:
    if: inputs.backfill_beats
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: content/engine/requirements.txt
      - name: Install Python packages and Chromium
        run: |
          pip install -r content/engine/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Read each sent episode's structure and send it to the dashboard
        env:
          HOMIE_SOCIAL_URL: ${{ secrets.HOMIE_SOCIAL_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: python scripts/backfill-beats.py

  render:
    if: ${{ !inputs.voice_check && !inputs.voice_audition && !inputs.backfill_beats }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: content/engine/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python packages and Chromium
        run: |
          pip install -r content/engine/requirements.txt
          python -m playwright install --with-deps chromium

      # Engine 2 (content/engine2) is set up only when a waiting reel says "engine": "v2",
      # so a run with Engine 1 reels only is exactly what it was before. If its setup fails, the
      # run goes on: the Engine 2 reel is marked failed and the Engine 1 reels still render.
      - name: Engine 2 · is a waiting reel built with it?
        id: e2
        env:
          RETRY_FAILED: ${{ inputs.retry_failed && '1' || '0' }}
        run: echo "needed=$(python scripts/render-batch.py --needs-engine2 || echo false)" >> "$GITHUB_OUTPUT"

      - name: Engine 2 · Node 22
        if: steps.e2.outputs.needed == 'true'
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: content/engine2/package-lock.json

      - name: Engine 2 · restore the SoundFont
        if: steps.e2.outputs.needed == 'true'
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: content/engine2/audio/cache
          key: engine2-soundfont-${{ hashFiles('content/engine2/audio/make_audio.py') }}
          restore-keys: engine2-soundfont-

      - name: Engine 2 · set up (pinned packages, base files, sampler, SoundFont)
        if: steps.e2.outputs.needed == 'true'
        continue-on-error: true
        run: bash content/engine2/tools_setup.sh

      - name: Restore ElevenLabs voice clips
        uses: actions/cache/restore@v4
        with:
          path: build/voice-cache
          key: voice-${{ github.run_id }}
          restore-keys: voice-

      - name: Render, check and send
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_LICENSED: ${{ vars.ELEVENLABS_LICENSED || secrets.ELEVENLABS_LICENSED }}
          VOICE_CACHE: ${{ github.workspace }}/build/voice-cache
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOMIE_SOCIAL_URL: ${{ secrets.HOMIE_SOCIAL_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RETRY_FAILED: ${{ inputs.retry_failed && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/render-batch.py

      - name: Save ElevenLabs voice clips (also when a reel failed, so paid clips aren't lost)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/voice-cache
          key: voice-${{ github.run_id }}

      - name: Keep the videos for 14 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ github.run_number }}
          path: build/export/*.mp4
          retention-days: 14
          if-no-files-found: ignore

      - name: Save sent / failed markers
        if: always()
        run: |
          git config user.name "homie-render-bot"
          git config user.email "actions@users.noreply.github.com"
          for d in content/sent content/failed; do if [ -d "$d" ]; then git add -A "$d"; fi; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Render run ${{ github.run_number }}: update sent/failed markers"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1

      - name: Alert Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-failures.mjs
