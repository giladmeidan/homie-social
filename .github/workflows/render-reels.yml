name: Render reels

# Runs when the nightly reel task pushes a new batch (content/batches/*.json) or
# new episodes. Renders every reel that has not been sent yet, checks it, and
# sends it to the Telegram approval bot. Nothing is posted without Approve.
on:
  push:
    branches: [main]
    paths:
      - 'content/batches/**'
      - 'content/episodes/**'
  workflow_dispatch:
    inputs:
      retry_failed:
        description: 'Retry reels that failed before'
        type: boolean
        default: false
      dry_run:
        description: 'Render and check only, do not send to Telegram'
        type: boolean
        default: false

permissions:
  contents: write # commits the content/sent and content/failed markers

concurrency:
  group: render-reels
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: content/engine/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python packages and Chromium
        run: |
          pip install -r content/engine/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Render, check and send
        env:
          HOMIE_SOCIAL_URL: ${{ secrets.HOMIE_SOCIAL_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RETRY_FAILED: ${{ inputs.retry_failed && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/render-batch.py

      - name: Keep the videos for 14 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ github.run_number }}
          path: build/export/*.mp4
          retention-days: 14
          if-no-files-found: ignore

      - name: Save sent / failed markers
        if: always()
        run: |
          git config user.name "homie-render-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/sent content/failed 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Render run ${{ github.run_number }}: update sent/failed markers"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1

      - name: Alert Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-failures.mjs
